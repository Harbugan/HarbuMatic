<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EBDC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HarbuMatic">
<meta name="description" content="HarbuMatic — a little machine for making music. Play first. Tweak forever.">
<title>HarbuMatic — a little machine for making music</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/views.css">
</head>
<body>
<div class="device" id="device" data-mode="jam">
  <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>

  <header class="hdr">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 3 L23.5 16.5 L37 20 L23.5 23.5 L20 37 L16.5 23.5 L3 20 L16.5 16.5Z" fill="#343047"/>
        <circle cx="31" cy="8" r="3" fill="#F2AFC0"/><circle cx="8" cy="32" r="2.4" fill="#A5DFCE"/>
      </svg>
      <div class="wordmark">Harbu<b>Matic</b></div>
    </div>
    <nav class="modes" role="tablist" aria-label="Mode">
      <button class="mode on" data-mode="jam" role="tab" type="button"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg><span>JAM</span></button>
      <button class="mode" data-mode="sound" role="tab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 12h3l3-7 4 14 3-9 2 2h5"/></svg><span>SOUND</span></button>
      <button class="mode" data-mode="arrange" role="tab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 12h18M12 4v16"/></svg><span>ARRANGE</span></button>
    </nav>
    <div class="hdr-r">
      <button class="ibtn" id="hUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="ibtn" id="hRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
      <button class="songbtn" id="hSong" type="button" aria-haspopup="menu">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
        <span class="songbtn-t"><small>Song</small><span id="songName">—</span></span>
        <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </header>

  <section class="strip">
    <div class="panel transport" aria-label="Transport">
      <button class="tbtn play" id="play" type="button" aria-label="Play"></button>
      <button class="tbtn stop" id="stop" type="button" title="Stop — back to the start (Esc)" aria-label="Stop"><svg class="ico" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="3" fill="currentColor" stroke="none"/></svg><span class="btn-l">Stop</span></button>
      <button class="tbtn rec" id="rec" type="button" data-testid="rec-btn" data-rec="off" aria-pressed="false" title="Record live pattern (R)" aria-label="Record"></button>
      <button class="tbtn quant on" id="quant" type="button" data-testid="rec-quantize" aria-pressed="true" title="Quantize live recording (Q)" aria-label="Quantize On"><span class="q-mark">Q</span><span class="btn-l">On</span></button>
      <div class="lcd" aria-hidden="true"><canvas id="screen" width="64" height="36"></canvas><div class="lcd-info"><span id="scrScene">A</span><span id="scrStep">—</span></div></div>
      <div class="bpm" role="group" aria-label="Tempo">
        <button class="bpm-b" id="bpmDn" type="button" aria-label="Slower">−</button>
        <div class="bpm-box" id="bpmBox" title="Drag up/down to change tempo"><b id="bpmVal">120</b><small>BPM</small></div>
        <button class="bpm-b" id="bpmUp" type="button" aria-label="Faster">+</button>
      </div>
    </div>
    <div class="cards-wrap" id="cardsWrap">
      <button class="cards-nav prev" id="cardsPrev" type="button" aria-label="Previous instrument" hidden>‹</button>
      <div class="cards" id="cards" aria-label="Instruments"></div>
      <button class="cards-nav next" id="cardsNext" type="button" aria-label="Next instrument" hidden>›</button>
    </div>
  </section>

  <main class="main">
    <section class="panel center" id="center">
      <div id="viewJam" class="view jam">
        <div class="toolbar" id="jamBar" role="toolbar" aria-label="Sequencer tools"></div>
        <div class="hint ed-hint" id="edHint"></div>
        <div class="roll-wrap" id="rollWrap"><canvas id="roll" aria-label="Sequencer grid"></canvas></div>
        <div class="ruff-seq" id="ruffSeq" data-testid="ruff-sequencer" hidden></div>
        <div class="leds" id="leds" aria-hidden="true"></div>
      </div>
      <div id="viewSound" class="view sound" hidden></div>
      <div id="viewArr" class="view arr" hidden></div>
    </section>

    <aside class="panel right" id="right" aria-label="Happy Accident Lab and scenes">
      <div class="rtabs"><div id="rtabSeg" class="rtab-seg"></div><button class="ibtn drawer-close" id="drawerClose" type="button" aria-label="Close panel"></button></div>
      <div class="rbody" id="rLab"></div>
      <div class="rbody" id="rScenes" hidden></div>
    </aside>
  </main>

  <section class="bottom">
    <div class="panel shapers" id="shapers"></div>
    <div class="panel fxbar" id="fxbar"></div>
  </section>

  <footer class="ident" id="ident"></footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="menu" id="menu" role="menu" aria-label="Song menu"></div>
<input type="file" id="fileIn" accept=".hbn,.json,application/json,application/zip,application/octet-stream" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="start" id="start">
  <div class="start-card">
    <div class="start-cats" id="startCats"></div>
    <div class="wordmark">Harbu<b>Matic</b></div>
    <div class="tagline">a little machine for making music · play first, tweak forever</div>
    <button class="start-btn" id="startBtn" type="button">TAP TO PLAY</button>
    <div class="start-sub"><span id="startSong"></span> · <button class="linkbtn" id="startNew" type="button">start a new song</button></div>
  </div>
</div>

<noscript><p style="padding:20px">HarbuMatic needs JavaScript.</p></noscript>
<script type="module" src="src/app/main.js"></script>
</body>
</html>
